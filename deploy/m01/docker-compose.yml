services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/m01/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/m01/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/m01/.env}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--http-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in deploy/m01/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in deploy/m01/.env}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/m01/.env}
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/m01/.env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/m01/.env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Keycloak must publish the HTTPS issuer that browsers and the Hub use,
      # even though Caddy reaches it over the private Compose network.
      KC_HOSTNAME: https://${M01_KEYCLOAK_EXTERNAL_HOSTNAME:?Set M01_KEYCLOAK_EXTERNAL_HOSTNAME in deploy/m01/.env}:${M01_KEYCLOAK_HTTPS_PORT:?Set M01_KEYCLOAK_HTTPS_PORT in deploy/m01/.env}
      KC_PROXY_HEADERS: xforwarded

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
    ports:
      # Do not expose Keycloak, PostgreSQL, or Caddy to a LAN/WAN interface.
      - "127.0.0.1:${M01_KEYCLOAK_HTTPS_PORT:?Set M01_KEYCLOAK_HTTPS_PORT in deploy/m01/.env}:443"
    environment:
      M01_KEYCLOAK_EXTERNAL_HOSTNAME: ${M01_KEYCLOAK_EXTERNAL_HOSTNAME:?Set M01_KEYCLOAK_EXTERNAL_HOSTNAME in deploy/m01/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  keycloak-postgres:
  caddy-data:
  caddy-config:
