<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执行面仪表盘</title>
  <link rel="stylesheet" href="/execution.css">
</head>
<body>
  <h1>执行面仪表盘</h1>

  <section>
    <h2>在线执行面</h2>
    <table id="agents">
      <thead>
        <tr>
          <th>agentId</th><th>名称</th><th>连接</th><th>运行状态</th><th>最后心跳</th><th>当前 run</th><th>能力</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>派单</h2>
    <form id="dispatch-form">
      <div class="row">
        <label>agentId <input id="dispatch-agent" value="execution-query-agent"></label>
      </div>
      <div class="row">
        <label>path <input id="dispatch-path" size="44" value="/external/material-kitting/shortages"></label>
      </div>
      <div class="row">
        <label>params(JSON) <input id="dispatch-params" size="44" value='{"demand_no":"HJY20260903-261"}'></label>
      </div>
      <button type="submit">派单</button>
    </form>
    <pre id="dispatch-result"></pre>
  </section>

  <section>
    <h2>运行记录</h2>
    <table id="runs">
      <thead>
        <tr>
          <th>runId</th><th>agent</th><th>能力</th><th>输入</th><th>状态</th><th>开始</th><th>结束</th><th>结果</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="/execution.js"></script>
</body>
</html>
