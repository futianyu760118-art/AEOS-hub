name: AEOS Hub CI

on:
  push:
    branches: [main, master, MVP]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm run check:contracts
      - run: npm test
      - name: Execution agent package tests
        working-directory: aeos-execution-agent
        run: |
          npm install --no-audit --no-fund
          npm test
